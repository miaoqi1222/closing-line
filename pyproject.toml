[project]
name = "closing-line"
version = "0.0.1"
description = "Measurement harness for probabilistic football forecasts against the closing line."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
